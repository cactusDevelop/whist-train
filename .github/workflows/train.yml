name: train

on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [ppo, jokers, jokers_eval]
        default: ppo
      init:
        description: "Jokers : repartir de l'archive (--init) au lieu de --resume"
        type: boolean
        default: false
  schedule:
    - cron: "17 */6 * * *"

concurrency:
  group: train-${{ inputs.mode || 'ppo' }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  train:
    if: vars.TRAINING_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      MODE: ${{ inputs.mode || 'ppo' }}
      # jokers_eval measures on the jokers state and never saves it
      STATE: ${{ inputs.mode == 'jokers_eval' && 'jokers' || inputs.mode || 'ppo' }}
      INIT: ${{ inputs.init || false }}
      GH_TOKEN: ${{ github.token }}
      STATE_KEY: ${{ secrets.STATE_KEY }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - id: restore
        name: Restore state
        run: |
          gh release download checkpoint-latest -p "state-$MODE.tar.gz.enc" -D .
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:STATE_KEY \
            -in "state-$MODE.tar.gz.enc" | tar xz
          rm "state-$MODE.tar.gz.enc"

      - id: train
        name: Train
        run: bash "ci/run_$MODE.sh" 2>&1 | tee "train_log_$MODE.txt"

      # Only after a successful restore: an empty state must never overwrite the release.
      - name: Upload eval log
        if: always() && env.MODE == 'jokers_eval'
        run: |
          cp "train_log_$MODE.txt" log-jokers_eval.txt
          gh release upload checkpoint-latest log-jokers_eval.txt --clobber

      - name: Save state
        if: always() && steps.restore.outcome == 'success' && env.MODE != 'jokers_eval'
        run: |
          tar cz $(while read -r f; do [ -e "$f" ] && echo "$f"; done < "ci/state_$MODE.txt") \
            | openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:STATE_KEY \
              -out "state-$MODE.tar.gz.enc"
          gh release upload checkpoint-latest "state-$MODE.tar.gz.enc" --clobber
          tail -c 200000 "train_log_$MODE.txt" > "log-$MODE.txt"
          gh release upload checkpoint-latest "log-$MODE.txt" --clobber

      - name: Chain next run
        if: success() && vars.TRAINING_ENABLED == 'true' && env.MODE != 'jokers_eval'
        run: gh workflow run train.yml -f mode="$MODE" -f init=false
