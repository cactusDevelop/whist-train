name: train

on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [ppo, ppo_free, free_match, free_emb_diag, free_misere_diag, obs_check, play_fixtures, jokers, jokers_small, jokers_eval, jokers_defence, jokers_test, jokers_duel, jokers_misere, jokers_pairs, jokers_diag, jokers_rules, jokers_profit, ppo_team_errors, dds_test, ppo_smoke, ppo_atout_diag, ppo_camp_diag, expert_bid_audit, dds_bench]
        default: ppo
      init:
        description: "Jokers : repartir de l'archive (--init) au lieu de --resume"
        type: boolean
        default: false
      minutes:
        description: "ppo_free : duree en minutes (vide = bloc long) ; free_match : donnes par ligne"
        type: string
        default: ""
  schedule:
    - cron: "17 */6 * * *"

concurrency:
  group: train-${{ inputs.mode || 'ppo' }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  train:
    if: vars.TRAINING_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      MODE: ${{ inputs.mode || 'ppo' }}
      # jokers_eval / jokers_defence / jokers_test measure on the jokers state, ppo_team_errors on the ppo state; none saves it
      MEASURE: ${{ inputs.mode == 'free_match' || inputs.mode == 'free_emb_diag' || inputs.mode == 'free_misere_diag' || inputs.mode == 'obs_check' || inputs.mode == 'play_fixtures' || inputs.mode == 'jokers_eval' || inputs.mode == 'jokers_defence' || inputs.mode == 'jokers_test' || inputs.mode == 'jokers_duel' || inputs.mode == 'jokers_misere' || inputs.mode == 'jokers_pairs' || inputs.mode == 'jokers_diag' || inputs.mode == 'jokers_rules' || inputs.mode == 'jokers_profit' || inputs.mode == 'ppo_team_errors' || inputs.mode == 'ppo_atout_diag' || inputs.mode == 'ppo_camp_diag' || inputs.mode == 'expert_bid_audit' || inputs.mode == 'dds_test' || inputs.mode == 'dds_bench' || inputs.mode == 'ppo_smoke' }}
      STATE: ${{ (inputs.mode == 'free_match' || inputs.mode == 'free_emb_diag' || inputs.mode == 'free_misere_diag' || inputs.mode == 'obs_check') && 'ppo_free' || (inputs.mode == 'play_fixtures' || inputs.mode == 'ppo_team_errors' || inputs.mode == 'ppo_atout_diag' || inputs.mode == 'ppo_camp_diag' || inputs.mode == 'expert_bid_audit' || inputs.mode == 'dds_test' || inputs.mode == 'dds_bench' || inputs.mode == 'ppo_smoke') && 'ppo' || (inputs.mode == 'jokers_small' || inputs.mode == 'jokers_eval' || inputs.mode == 'jokers_defence' || inputs.mode == 'jokers_test' || inputs.mode == 'jokers_duel' || inputs.mode == 'jokers_misere' || inputs.mode == 'jokers_pairs' || inputs.mode == 'jokers_diag' || inputs.mode == 'jokers_rules' || inputs.mode == 'jokers_profit') && 'jokers' || inputs.mode || 'ppo' }}
      INIT: ${{ inputs.init || false }}
      FREE_MINUTES: ${{ inputs.minutes }}
      GH_TOKEN: ${{ github.token }}
      STATE_KEY: ${{ secrets.STATE_KEY }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      # Pause (ci/<mode>_paused) : le run se termine en SUCCES sans rien faire (pas de mail "run failed").
      - id: pause
        name: Pause check
        run: |
          if [ -f "ci/${MODE}_paused" ]; then
            echo "$MODE en pause : $(cat "ci/${MODE}_paused")"
            echo "paused=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.pause.outputs.paused != 'true'
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt
        if: steps.pause.outputs.paused != 'true'

      - id: restore
        name: Restore state
        if: steps.pause.outputs.paused != 'true'
        run: |
          # L'IA libre lit la championne et l'encherisseur de l'etat ppo, sans jamais l'ecrire.
          if [ "$STATE" = ppo_free ]; then
            gh release download checkpoint-latest -p state-ppo.tar.gz.enc -D .
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:STATE_KEY               -in state-ppo.tar.gz.enc | tar xz
            rm state-ppo.tar.gz.enc
            gh release download checkpoint-latest -p state-ppo_free.tar.gz.enc -D . || exit 0
          else
            gh release download checkpoint-latest -p "state-$STATE.tar.gz.enc" -D .
          fi
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:STATE_KEY \
            -in "state-$STATE.tar.gz.enc" | tar xz
          rm "state-$STATE.tar.gz.enc"

      - id: train
        name: Train
        if: steps.pause.outputs.paused != 'true'
        run: bash "ci/run_$MODE.sh" 2>&1 | tee "train_log_$MODE.txt"

      # Only after a successful restore: an empty state must never overwrite the release.
      - name: Upload eval log
        if: always() && steps.pause.outputs.paused != 'true' && env.MEASURE == 'true'
        run: |
          cp "train_log_$MODE.txt" "log-$MODE.txt" 2>/dev/null || echo "pas de log (Train non lance)" > "log-$MODE.txt"
          gh release upload checkpoint-latest "log-$MODE.txt" --clobber

      - name: Save state
        if: always() && steps.restore.outcome == 'success' && env.MEASURE != 'true'
        run: |
          tar cz $(while read -r f; do [ -e "$f" ] && echo "$f"; done < "ci/state_$MODE.txt") \
            | openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:STATE_KEY \
              -out "state-$STATE.tar.gz.enc"
          gh release upload checkpoint-latest "state-$STATE.tar.gz.enc" --clobber
          tail -c 200000 "train_log_$MODE.txt" > "log-$MODE.txt"
          gh release upload checkpoint-latest "log-$MODE.txt" --clobber

      - name: Chain next run
        if: success() && steps.pause.outputs.paused != 'true' && vars.TRAINING_ENABLED == 'true' && env.MEASURE != 'true' && env.MODE != 'jokers_small'
        run: |
          # L'IA libre ne s'enchaine que si ci/ppo_free_chain existe (runs courts d'abord).
          if [ "$MODE" = ppo_free ] && [ ! -f ci/ppo_free_chain ]; then exit 0; fi
          gh workflow run train.yml -f mode="$MODE" -f init=false
