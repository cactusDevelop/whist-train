name: train

on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [ppo, jokers, jokers_eval, jokers_defence, jokers_test, jokers_duel, ppo_team_errors, dds_test, ppo_smoke, ppo_atout_diag, ppo_camp_diag]
        default: ppo
      init:
        description: "Jokers : repartir de l'archive (--init) au lieu de --resume"
        type: boolean
        default: false
  schedule:
    - cron: "17 */6 * * *"

concurrency:
  group: train-${{ inputs.mode || 'ppo' }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  train:
    if: vars.TRAINING_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      MODE: ${{ inputs.mode || 'ppo' }}
      # jokers_eval / jokers_defence / jokers_test measure on the jokers state, ppo_team_errors on the ppo state; none saves it
      MEASURE: ${{ inputs.mode == 'jokers_eval' || inputs.mode == 'jokers_defence' || inputs.mode == 'jokers_test' || inputs.mode == 'jokers_duel' || inputs.mode == 'ppo_team_errors' || inputs.mode == 'ppo_atout_diag' || inputs.mode == 'ppo_camp_diag' || inputs.mode == 'dds_test' || inputs.mode == 'ppo_smoke' }}
      STATE: ${{ (inputs.mode == 'ppo_team_errors' || inputs.mode == 'ppo_atout_diag' || inputs.mode == 'ppo_camp_diag' || inputs.mode == 'dds_test' || inputs.mode == 'ppo_smoke') && 'ppo' || (inputs.mode == 'jokers_eval' || inputs.mode == 'jokers_defence' || inputs.mode == 'jokers_test' || inputs.mode == 'jokers_duel') && 'jokers' || inputs.mode || 'ppo' }}
      INIT: ${{ inputs.init || false }}
      GH_TOKEN: ${{ github.token }}
      STATE_KEY: ${{ secrets.STATE_KEY }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - id: restore
        name: Restore state
        run: |
          gh release download checkpoint-latest -p "state-$STATE.tar.gz.enc" -D .
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:STATE_KEY \
            -in "state-$STATE.tar.gz.enc" | tar xz
          rm "state-$STATE.tar.gz.enc"

      - id: train
        name: Train
        run: bash "ci/run_$MODE.sh" 2>&1 | tee "train_log_$MODE.txt"

      # Only after a successful restore: an empty state must never overwrite the release.
      - name: Upload eval log
        if: always() && env.MEASURE == 'true'
        run: |
          cp "train_log_$MODE.txt" "log-$MODE.txt" 2>/dev/null || echo "pas de log (Train non lance)" > "log-$MODE.txt"
          gh release upload checkpoint-latest "log-$MODE.txt" --clobber

      - name: Save state
        if: always() && steps.restore.outcome == 'success' && env.MEASURE != 'true'
        run: |
          tar cz $(while read -r f; do [ -e "$f" ] && echo "$f"; done < "ci/state_$MODE.txt") \
            | openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:STATE_KEY \
              -out "state-$STATE.tar.gz.enc"
          gh release upload checkpoint-latest "state-$STATE.tar.gz.enc" --clobber
          tail -c 200000 "train_log_$MODE.txt" > "log-$MODE.txt"
          gh release upload checkpoint-latest "log-$MODE.txt" --clobber

      - name: Chain next run
        if: success() && vars.TRAINING_ENABLED == 'true' && env.MEASURE != 'true'
        run: gh workflow run train.yml -f mode="$MODE" -f init=false
